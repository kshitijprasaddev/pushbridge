name: Submission checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl]'
      - name: Run package tests
        run: python -m pytest -q
      - name: Verify included evidence
        run: python scripts/audit_submission.py
      - name: Verify longer RL comparison
        run: python scripts/audit_rl_followup.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          package_json_file: web/package.json
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify replay geometry and exported evidence
        run: pnpm test
      - name: Build production frontend
        run: pnpm build
